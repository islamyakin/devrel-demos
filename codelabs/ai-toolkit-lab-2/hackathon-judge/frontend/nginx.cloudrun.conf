server {
    listen 80;
    server_name _;
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    # Backend is a sidecar in the same Cloud Run instance (port 8080, hardcoded in
    # backend/cmd/api/main.go) and is never exposed to the internet.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;  # no trailing slash: keep the /api prefix, the Go routes live under /api
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
