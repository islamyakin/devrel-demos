# Three images instead of four: the agent-sandbox image is gone, the agent
# image now carries the toolchain the sandboxes borrow.
steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    dir: backend
    args: ['build', '-t', '${_IMAGE_BASE}/backend:${_TAG}', '.']
    waitFor: ['-']
  - id: frontend
    name: gcr.io/cloud-builders/docker
    dir: frontend
    args: ['build', '-f', 'Dockerfile.cloudrun', '-t', '${_IMAGE_BASE}/frontend-cloudrun:${_TAG}', '.']
    waitFor: ['-']
  - id: agent
    name: gcr.io/cloud-builders/docker
    dir: agent
    args: ['build', '-f', 'Dockerfile.cloudrun', '-t', '${_IMAGE_BASE}/agent-cloudrun:${_TAG}', '.']
    waitFor: ['-']
images:
  - '${_IMAGE_BASE}/backend:${_TAG}'
  - '${_IMAGE_BASE}/frontend-cloudrun:${_TAG}'
  - '${_IMAGE_BASE}/agent-cloudrun:${_TAG}'
options:
  machineType: E2_HIGHCPU_8
