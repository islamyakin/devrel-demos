# Frontend (nginx, ingress) + backend (Go API, sidecar) in ONE Cloud Run service.
# The backend keeps a streaming Pub/Sub pull open for results, so CPU stays
# allocated and one instance is always warm.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${WEB_SERVICE}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/container-dependencies: '{"web":["api"]}'
    spec:
      serviceAccountName: ${WEB_SA}
      containers:
        - name: web
          image: ${IMAGE_BASE}/frontend-cloudrun:${TAG}
          ports:
            - containerPort: 80
          resources:
            limits: { cpu: "1", memory: 512Mi }
        - name: api
          image: ${IMAGE_BASE}/backend:${TAG}
          env:
            - { name: GOOGLE_CLOUD_PROJECT, value: "${GOOGLE_CLOUD_PROJECT}" }
            - { name: TASKS_TOPIC, value: "${TASKS_TOPIC}" }
            - { name: RESULTS_SUB, value: "${RESULTS_SUB}" }
            - { name: BQ_DATASET, value: "${BQ_DATASET}" }
          resources:
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
